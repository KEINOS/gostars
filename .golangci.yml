version: "2"

run:
    tests: true
    allow-parallel-runners: true

linters:
    default: all
    disable:
        # Deprecated in v2; replaced by wsl_v5.
        - wsl
        # Allow to use external dependencies.
        - depguard
        # Allow global variables for mocking in tests.
        - gochecknoglobals
    settings:
        paralleltest:
            ignore-missing: false   # Enforce t.Parallel() in tests
        varnamelen:
            ignore-names:
                - ok